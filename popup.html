<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Upload date</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">
      <span class="dot"></span>
      Upload date
    </span>
    <button id="refresh" class="icon-btn" title="Refresh" aria-label="Refresh">&#x21bb;</button>
  </header>

  <div class="tzbar">
    <label for="tzSelect" class="tzlabel">Timezone</label>
    <select id="tzSelect" class="tzselect">
      <option value="local">Local (auto)</option>
      <option value="UTC">UTC</option>
      <optgroup label="Americas">
        <option value="America/New_York">New York (ET)</option>
        <option value="America/Chicago">Chicago (CT)</option>
        <option value="America/Denver">Denver (MT)</option>
        <option value="America/Los_Angeles">Los Angeles (PT)</option>
        <option value="America/Anchorage">Anchorage (AKT)</option>
        <option value="Pacific/Honolulu">Honolulu (HST)</option>
        <option value="America/Mexico_City">Mexico City</option>
        <option value="America/Bogota">Bogotá</option>
        <option value="America/Sao_Paulo">São Paulo</option>
        <option value="America/Argentina/Buenos_Aires">Buenos Aires</option>
      </optgroup>
      <optgroup label="Europe / Africa">
        <option value="Europe/London">London (GMT/BST)</option>
        <option value="Europe/Dublin">Dublin</option>
        <option value="Europe/Paris">Paris (CET)</option>
        <option value="Europe/Berlin">Berlin</option>
        <option value="Europe/Madrid">Madrid</option>
        <option value="Europe/Rome">Rome</option>
        <option value="Europe/Amsterdam">Amsterdam</option>
        <option value="Europe/Stockholm">Stockholm</option>
        <option value="Europe/Athens">Athens</option>
        <option value="Europe/Moscow">Moscow</option>
        <option value="Europe/Istanbul">Istanbul</option>
        <option value="Africa/Cairo">Cairo</option>
        <option value="Africa/Johannesburg">Johannesburg</option>
        <option value="Africa/Lagos">Lagos</option>
      </optgroup>
      <optgroup label="Middle East / Asia">
        <option value="Asia/Dubai">Dubai</option>
        <option value="Asia/Tehran">Tehran</option>
        <option value="Asia/Karachi">Karachi</option>
        <option value="Asia/Kolkata">India (IST)</option>
        <option value="Asia/Kathmandu">Kathmandu</option>
        <option value="Asia/Dhaka">Dhaka</option>
        <option value="Asia/Bangkok">Bangkok</option>
        <option value="Asia/Jakarta">Jakarta</option>
        <option value="Asia/Singapore">Singapore</option>
        <option value="Asia/Hong_Kong">Hong Kong</option>
        <option value="Asia/Shanghai">Shanghai</option>
        <option value="Asia/Taipei">Taipei</option>
        <option value="Asia/Seoul">Seoul</option>
        <option value="Asia/Tokyo">Tokyo</option>
      </optgroup>
      <optgroup label="Oceania">
        <option value="Australia/Perth">Perth</option>
        <option value="Australia/Adelaide">Adelaide</option>
        <option value="Australia/Brisbane">Brisbane</option>
        <option value="Australia/Sydney">Sydney</option>
        <option value="Australia/Melbourne">Melbourne</option>
        <option value="Pacific/Auckland">Auckland</option>
        <option value="Pacific/Fiji">Fiji</option>
      </optgroup>
    </select>
  </div>

  <main id="content" class="content">
    <div class="muted">Reading video…</div>
  </main>

  <footer class="footer">Times shown in the selected timezone</footer>

  <script src="popup.js"></script>
</body>
</html>
